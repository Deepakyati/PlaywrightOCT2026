name: Playwright Tests

# Triggers: when to run this pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Cloud VM running Linux

    steps:
      # Step 1: Clone your repository into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install project npm packages
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Playwright browsers and Linux OS libraries
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      # Step 5: Execute your test suite
      - name: Run Playwright tests
        run: npx playwright test tests/greenkart.spec.ts --project=chromium

      # Step 6: Save the HTML report as an artifact (even if tests fail)
      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14